services:
  - type: web
    name: deliverycoite-node
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --workspace @delivery/api --workspace @delivery/web --include-workspace-root && npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: APP_ENV
        value: production
      - key: ALLOW_PRODUCTION_SEED
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: ROOT_DOMAIN
        value: hubregional.com.br
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        value: hubregional.com.br
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_MASTER_EMAIL
        sync: false
      - key: SEED_MASTER_PASSWORD
        sync: false
      - key: MENUIA_API_BASE_URL
        value: https://chatbot.menuia.com
      - key: MENUIA_LICENSE
        value: hugocursos
